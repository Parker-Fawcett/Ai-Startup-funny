{% if filings_due %}
  <ol class="route">
    {% for f in filings_due %}
      <li>
        <span class="{% if f.days_left < 0 %}overdue{% endif %}"><strong>{{ f.days_left }}d</strong></span>
        <span>{{ f.job.customer.name }}: {{ f.rule_label }}, {{ f.form_variant }}, due {{ f.due|date:"Y-m-d" }} (JOB-{{ f.job.pk|stringformat:"06d" }})</span>
      </li>
    {% endfor %}
  </ol>
{% else %}
  <p class="hint">No open filing windows.</p>
{% endif %}
