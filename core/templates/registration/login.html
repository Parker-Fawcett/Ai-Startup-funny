{% extends "core/base.html" %}
{% block content %}
<div class="card" style="max-width:26rem;margin:2.5rem auto">
  <div class="kicker">Welcome back</div>
  <h2>Log in to PumpRun</h2>
  {% if form.errors %}<div class="errors">Check your username and password.</div>{% endif %}
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn big" type="submit">Log in</button>
  </form>
  <p class="hint" style="margin-top:1rem">New here? <a href="{% url 'signup' %}">Start free trial</a> · <a href="{% url 'pricing' %}">Pricing</a></p>
</div>
{% endblock %}
